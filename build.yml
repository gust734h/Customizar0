name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Criar projeto e compilar
        run: |
          mkdir -p poco/app/src/main/java/com/poco/optimizer
          cd poco
          cat > settings.gradle.kts <<'FIM0'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "PocoOptimizer"
          include(":app")
          FIM0
          cat > build.gradle.kts <<'FIM1'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          FIM1
          cat > gradle.properties <<'FIM2'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          FIM2
          cat > app/build.gradle.kts <<'FIM3'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.poco.optimizer"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.poco.optimizer"
                  minSdk = 30
                  targetSdk = 35
                  versionCode = 2
                  versionName = "2.0"
              }
              buildTypes {
                  release { isMinifyEnabled = false }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation("dev.rikka.shizuku:api:13.1.5")
              implementation("dev.rikka.shizuku:provider:13.1.5")
          }
          FIM3
          cat > app/src/main/AndroidManifest.xml <<'FIM4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <application
                  android:allowBackup="false"
                  android:label="Poco F7 Optimizer"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <provider
                      android:name="rikka.shizuku.ShizukuProvider"
                      android:authorities="${applicationId}.shizuku"
                      android:enabled="true"
                      android:exported="true"
                      android:multiprocess="false"
                      android:permission="android.permission.INTERACT_ACROSS_USERS_FULL" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          FIM4
          cat > app/src/main/java/com/poco/optimizer/Shell.kt <<'FIM5'
          package com.poco.optimizer

          import rikka.shizuku.Shizuku

          /** Executa comandos de shell com a permissão do Shizuku (UID shell/ADB). */
          object Shell {
              private val newProcess by lazy {
                  Shizuku::class.java.getDeclaredMethod(
                      "newProcess",
                      Array<String>::class.java,
                      Array<String>::class.java,
                      String::class.java
                  ).apply { isAccessible = true }
              }

              fun run(cmd: String): String {
                  val p = newProcess.invoke(null, arrayOf("sh", "-c", cmd), null, null) as Process
                  val out = p.inputStream.bufferedReader().readText()
                  val err = p.errorStream.bufferedReader().readText()
                  p.waitFor()
                  return (out + err).trim()
              }
          }
          FIM5
          cat > app/src/main/java/com/poco/optimizer/Optimizer.kt <<'FIM6'
          package com.poco.optimizer

          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject

          class Optimizer(ctx: Context, private val log: (String) -> Unit) {

              private val prefs = ctx.getSharedPreferences("backup", Context.MODE_PRIVATE)

              val bloat = listOf(
                  "com.miui.analytics" to "Analytics Xiaomi (telemetria)",
                  "com.miui.msa.global" to "MSA (anúncios do sistema)",
                  "com.miui.systemAdSolution" to "Anúncios do sistema",
                  "com.xiaomi.mipicks" to "GetApps (loja Xiaomi)",
                  "com.miui.bugreport" to "Relatório de erros",
                  "com.xiaomi.midrop" to "ShareMe",
                  "com.miui.videoplayer" to "Mi Vídeo",
                  "com.miui.player" to "Mi Música",
                  "com.mi.globalbrowser" to "Navegador Mi",
                  "com.mi.android.globalminusscreen" to "App Vault (tela à esquerda)",
                  "com.miui.hybrid" to "Quick Apps",
                  "com.miui.hybrid.accessory" to "Quick Apps (acessório)",
                  "com.miui.huanji" to "Mi Mover",
                  "com.miui.miservice" to "Serviços e feedback",
                  "com.miui.yellowpage" to "Páginas Amarelas",
                  "com.facebook.system" to "Facebook (pré-instalado)",
                  "com.facebook.appmanager" to "Facebook App Manager",
                  "com.facebook.services" to "Facebook Services",
                  "com.netflix.partner.activation" to "Netflix (ativação)"
              )

              private fun sh(c: String) = Shell.run(c)

              private fun arr(k: String) = JSONArray(prefs.getString(k, "[]")!!)

              private fun remember(k: String, v: String) {
                  val a = arr(k)
                  for (i in 0 until a.length()) if (a.getString(i) == v) return
                  a.put(v)
                  prefs.edit().putString(k, a.toString()).apply()
              }

              /** Altera uma setting guardando o valor original para restaurar depois. */
              private fun put(ns: String, key: String, value: String) {
                  val saved = JSONObject(prefs.getString("settings", "{}")!!)
                  val k = "$ns:$key"
                  if (!saved.has(k)) {
                      saved.put(k, sh("settings get $ns $key"))
                      prefs.edit().putString("settings", saved.toString()).apply()
                  }
                  sh("settings put $ns $key $value")
              }

              private fun dcPut(ns: String, key: String, value: String) {
                  remember("dc", "$ns $key")
                  val o = sh("device_config put $ns $key $value")
                  if (o.isNotBlank()) log("device_config: $o")
              }

              fun thirdParty() =
                  sh("pm list packages -3").lines().map { it.removePrefix("package:").trim() }.filter { it.isNotEmpty() }

              fun installedBloat(): List<Pair<String, String>> {
                  val all = sh("pm list packages").lines().map { it.removePrefix("package:").trim() }.toSet()
                  return bloat.filter { it.first in all }
              }

              private fun avail(): String {
                  val n = sh("grep MemAvailable /proc/meminfo").replace(Regex("[^0-9]"), "").toLongOrNull()
                  return if (n == null) "?" else "${n / 1024} MB"
              }

              // ---------- diagnóstico ----------
              fun diagnostics() {
                  log("Modelo: ${sh("getprop ro.product.model")} | Android ${sh("getprop ro.build.version.release")}")
                  log("HyperOS: ${sh("getprop ro.mi.os.version.name")} | Kernel: ${sh("uname -r")}")
                  log("Ligado há: ${sh("uptime -p")}")
                  log("--- Bateria ---")
                  log(sh("dumpsys battery | grep -E 'level|temperature|health|status'"))
                  log("(temperature = décimos de °C; 350 = 35,0 °C)")
                  log("--- Memória ---")
                  log(sh("grep -E 'MemTotal|MemAvailable|SwapTotal|SwapFree' /proc/meminfo"))
                  log("--- Armazenamento ---")
                  log(sh("df -h /data | tail -1"))
                  log("--- Temperaturas ---")
                  log(sh("dumpsys thermalservice | grep -E 'Temperature\\{' | head -10"))
                  log("--- Apps que mais usam RAM ---")
                  log(sh("dumpsys meminfo | grep -A 12 'Total PSS by process'"))
              }

              // ---------- RAM e processos ----------
              fun ramBoost() {
                  val before = avail()
                  sh("am kill-all")
                  log("RAM livre: $before → ${avail()}")
              }

              fun moreRam() {
                  dcPut("activity_manager", "max_cached_processes", "64")
                  log("Até 64 processos em cache (mais apps abertos na RAM; efeito pleno após reiniciar).")
              }

              fun phantomProcs() {
                  dcPut("activity_manager", "max_phantom_processes", "2147483647")
                  put("global", "settings_enable_monitor_phantom_procs", "false")
                  log("Limite de processos fantasma removido (o sistema pode reverter após reiniciar).")
              }

              fun systemTweaks() {
                  put("global", "app_standby_enabled", "1")
                  put("global", "adaptive_battery_management_enabled", "1")
                  put("global", "cached_apps_freezer", "enabled")
                  log("Congelador de apps em cache e bateria adaptativa ativados.")
              }

              // ---------- armazenamento e apps ----------
              fun cleanCache() {
                  sh("pm trim-caches 999G")
                  log("Cache limpo.")
              }

              fun storageMaintenance() {
                  log("Executando manutenção (TRIM) do armazenamento...")
                  log(sh("sm idle-maint run"))
                  log("Manutenção solicitada ao sistema.")
              }

              fun compile(mode: String) {
                  log("Compilando apps ($mode)... pode levar vários minutos.")
                  log(sh("cmd package compile -m $mode -a"))
                  log(sh("cmd package bg-dexopt-job"))
              }

              fun compileReset() {
                  log(sh("cmd package compile --reset -a"))
                  log("Compilação desfeita (volta ao padrão do sistema).")
              }

              fun batteryReset() {
                  sh("dumpsys batterystats --reset")
                  log("Estatísticas de bateria zeradas.")
              }

              // ---------- tela ----------
              fun animations(scale: String) {
                  listOf("window_animation_scale", "transition_animation_scale", "animator_duration_scale")
                      .forEach { put("global", it, scale) }
                  log("Animações em ${scale}x.")
              }

              fun refresh(min: Int, peak: Int) {
                  put("system", "min_refresh_rate", min.toString())
                  put("system", "peak_refresh_rate", peak.toString())
                  put("system", "user_refresh_rate", peak.toString())
                  log("Taxa de atualização: $min–$peak Hz.")
              }

              fun blur(enabled: Boolean) {
                  put("global", "disable_window_blurs", if (enabled) "0" else "1")
                  log(if (enabled) "Desfoque de janelas ligado." else "Desfoque de janelas desligado (menos carga na GPU).")
              }

              // ---------- apps escolhidos ----------
              fun forceStop(pkgs: List<String>) {
                  pkgs.forEach { sh("am force-stop $it") }
                  log("${pkgs.size} apps encerrados.")
              }

              fun restrictBg(pkgs: List<String>) {
                  pkgs.forEach {
                      sh("cmd appops set $it RUN_IN_BACKGROUND ignore")
                      sh("cmd appops set $it RUN_ANY_IN_BACKGROUND ignore")
                      sh("am force-stop $it")
                      remember("appops", it)
                  }
                  log("${pkgs.size} apps sem permissão de rodar em segundo plano (notificações podem atrasar).")
              }

              fun standby(pkgs: List<String>, bucket: String) {
                  pkgs.forEach {
                      sh("am set-standby-bucket $it $bucket")
                      remember("buckets", it)
                  }
                  log("${pkgs.size} apps no nível de standby: $bucket")
              }

              fun gameMode(pkgs: List<String>, mode: String) {
                  pkgs.forEach {
                      val o = sh("cmd game mode $mode $it")
                      remember("game", it)
                      log("$it: ${if (o.isBlank()) "ok" else o}")
                  }
                  log("Modo jogo '$mode' enviado (o efeito depende de o jogo suportar).")
              }

              fun debloat(pkgs: List<String>) {
                  pkgs.forEach { p ->
                      val ok = sh("pm uninstall -k --user 0 $p").contains("Success")
                      log((if (ok) "✔ " else "· falhou: ") + p)
                      if (ok) remember("removed", p)
                  }
              }

              // ---------- rede ----------
              fun privateDns(host: String?) {
                  if (host == null) {
                      put("global", "private_dns_mode", "opportunistic")
                  } else {
                      put("global", "private_dns_mode", "hostname")
                      put("global", "private_dns_specifier", host)
                  }
                  log("DNS privado: ${host ?: "automático"}")
              }

              // ---------- perfis ----------
              fun profilePerformance() {
                  animations("0.5"); refresh(120, 120); blur(false); moreRam(); ramBoost()
                  log("🚀 Perfil Desempenho aplicado.")
              }

              fun profileBalanced() {
                  animations("1"); refresh(60, 120); blur(true); systemTweaks()
                  log("⚖️ Perfil Equilibrado aplicado.")
              }

              fun profileBattery() {
                  animations("0.5"); refresh(60, 60); blur(false); systemTweaks(); cleanCache()
                  log("🔋 Perfil Economia aplicado.")
              }

              fun boost() {
                  cleanCache(); animations("0.5"); systemTweaks(); ramBoost(); batteryReset()
                  storageMaintenance(); compile("speed-profile")
                  log("⚡ Boost completo finalizado.")
              }

              // ---------- restaurar ----------
              fun restore() {
                  val saved = JSONObject(prefs.getString("settings", "{}")!!)
                  saved.keys().forEach { k ->
                      val (ns, key) = k.split(":")
                      val v = saved.getString(k)
                      if (v == "null" || v.isEmpty()) sh("settings delete $ns $key")
                      else sh("settings put $ns $key $v")
                  }
                  val dc = arr("dc")
                  for (i in 0 until dc.length()) {
                      val (ns, key) = dc.getString(i).split(" ")
                      sh("device_config delete $ns $key")
                  }
                  val ops = arr("appops")
                  for (i in 0 until ops.length()) {
                      val p = ops.getString(i)
                      sh("cmd appops set $p RUN_IN_BACKGROUND default")
                      sh("cmd appops set $p RUN_ANY_IN_BACKGROUND default")
                  }
                  val bk = arr("buckets")
                  for (i in 0 until bk.length()) sh("am set-standby-bucket ${bk.getString(i)} working_set")
                  val gm = arr("game")
                  for (i in 0 until gm.length()) sh("cmd game mode standard ${gm.getString(i)}")
                  val removed = arr("removed")
                  for (i in 0 until removed.length()) log(sh("cmd package install-existing ${removed.getString(i)}"))
                  prefs.edit().clear().apply()
                  log("Tudo restaurado ao original.")
              }
          }
          FIM6
          cat > app/src/main/java/com/poco/optimizer/MainActivity.kt <<'FIM7'
          package com.poco.optimizer

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.pm.PackageManager
          import android.graphics.Typeface
          import android.os.Bundle
          import android.view.WindowInsets
          import android.widget.*
          import rikka.shizuku.Shizuku
          import java.util.concurrent.Executors

          class MainActivity : Activity() {

              private val exec = Executors.newSingleThreadExecutor()
              private lateinit var root: LinearLayout
              private lateinit var status: TextView
              private lateinit var logView: TextView
              private val buttons = mutableListOf<Button>()
              private lateinit var opt: Optimizer

              private val permListener = Shizuku.OnRequestPermissionResultListener { _, _ -> refresh() }
              private val binderListener = Shizuku.OnBinderReceivedListener { runOnUiThread { refresh() } }
              private val deadListener = Shizuku.OnBinderDeadListener { runOnUiThread { refresh() } }

              private fun ready() =
                  Shizuku.pingBinder() && Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
              private fun toast(m: String) = Toast.makeText(this, m, Toast.LENGTH_LONG).show()
              private fun say(m: String) = runOnUiThread { logView.append(m + "\n") }

              private fun header(t: String) {
                  root.addView(TextView(this).apply {
                      text = t; textSize = 15f; setTypeface(null, Typeface.BOLD)
                      setPadding(0, dp(18), 0, dp(4))
                  })
              }

              /** Botão que executa em segundo plano. */
              private fun add(label: String, action: () -> Unit) = addUi(label) { runTask(action) }

              /** Botão que roda na tela (abre diálogos). */
              private fun addUi(label: String, action: () -> Unit) {
                  val b = Button(this).apply {
                      text = label
                      setAllCaps(false)
                      setOnClickListener { action() }
                  }
                  buttons.add(b)
                  root.addView(b)
              }

              private fun label(p: String): String = try {
                  packageManager.getApplicationLabel(packageManager.getApplicationInfo(p, 0)).toString()
              } catch (e: Exception) {
                  p
              }

              private fun multi(title: String, labels: List<String>, ids: List<String>, ok: (List<String>) -> Unit) {
                  val checked = BooleanArray(ids.size)
                  AlertDialog.Builder(this)
                      .setTitle(title)
                      .setMultiChoiceItems(labels.toTypedArray(), checked) { _, i, c -> checked[i] = c }
                      .setPositiveButton("Aplicar") { _, _ -> ok(ids.filterIndexed { i, _ -> checked[i] }) }
                      .setNegativeButton("Cancelar", null)
                      .show()
              }

              private fun appsAction(title: String, run: (List<String>) -> Unit) {
                  exec.execute {
                      val items = opt.thirdParty()
                          .filter { it != packageName }
                          .map { it to label(it) }
                          .sortedBy { it.second.lowercase() }
                      runOnUiThread {
                          multi(title, items.map { it.second + "\n" + it.first }, items.map { it.first }) { sel ->
                              if (sel.isEmpty()) toast("Nada selecionado") else runTask { run(sel) }
                          }
                      }
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  opt = Optimizer(this) { msg -> say(msg) }

                  root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  val pad = dp(16)
                  root.setOnApplyWindowInsetsListener { v, ins ->
                      val b = ins.getInsets(WindowInsets.Type.systemBars())
                      v.setPadding(pad, b.top + pad, pad, b.bottom + pad)
                      ins
                  }

                  root.addView(TextView(this).apply {
                      text = "POCO F7 OPTIMIZER  v2"; textSize = 22f; setTypeface(null, Typeface.BOLD)
                  })
                  status = TextView(this).apply { setPadding(0, dp(8), 0, dp(8)) }
                  root.addView(status)

                  root.addView(Button(this).apply {
                      text = "Conceder permissão Shizuku"
                      setAllCaps(false)
                      setOnClickListener {
                          if (!Shizuku.pingBinder()) toast("Abra o app Shizuku e inicie o serviço primeiro.")
                          else Shizuku.requestPermission(100)
                      }
                  })

                  logView = TextView(this).apply {
                      setTextIsSelectable(true); typeface = Typeface.MONOSPACE; textSize = 12f
                      setPadding(0, dp(12), 0, dp(4)); text = "Resultados aparecem aqui.\n"
                  }
                  root.addView(logView)
                  root.addView(Button(this).apply {
                      text = "Limpar resultados"; setAllCaps(false)
                      setOnClickListener { logView.text = "" }
                  })

                  header("PERFIS")
                  add("🚀 Modo Desempenho (120 Hz, animações rápidas, RAM livre)") { opt.profilePerformance() }
                  add("⚖️ Modo Equilibrado (recomendado no dia a dia)") { opt.profileBalanced() }
                  add("🔋 Modo Economia (60 Hz, menos efeitos)") { opt.profileBattery() }
                  add("⚡ BOOST COMPLETO (leva alguns minutos)") { opt.boost() }

                  header("DIAGNÓSTICO")
                  add("📊 Diagnóstico (RAM, temperatura, bateria, apps pesados)") { opt.diagnostics() }

                  header("RAM E PROCESSOS")
                  add("Liberar RAM agora") { opt.ramBoost() }
                  add("Manter mais apps na RAM (64 em cache)") { opt.moreRam() }
                  add("Impedir o Android de matar processos em 2º plano") { opt.phantomProcs() }
                  add("Congelar apps em cache + bateria adaptativa") { opt.systemTweaks() }

                  header("ARMAZENAMENTO E VELOCIDADE DOS APPS")
                  add("Limpar cache de todos os apps") { opt.cleanCache() }
                  add("Manutenção do armazenamento (TRIM)") { opt.storageMaintenance() }
                  add("Compilar apps - recomendado") { opt.compile("speed-profile") }
                  add("Compilar apps - máximo (usa mais espaço)") { opt.compile("speed") }
                  add("Desfazer compilação") { opt.compileReset() }
                  add("Zerar estatísticas de bateria") { opt.batteryReset() }

                  header("TELA E ANIMAÇÕES")
                  add("Tela fixa em 120 Hz") { opt.refresh(120, 120) }
                  add("Tela adaptativa 60-120 Hz") { opt.refresh(60, 120) }
                  add("Tela fixa em 60 Hz (economia)") { opt.refresh(60, 60) }
                  add("Animações 0.5x") { opt.animations("0.5") }
                  add("Animações desligadas") { opt.animations("0") }
                  add("Animações normais (1x)") { opt.animations("1") }
                  add("Desligar desfoque de janelas") { opt.blur(false) }
                  add("Ligar desfoque de janelas") { opt.blur(true) }

                  header("APPS (você escolhe na lista)")
                  addUi("Encerrar apps selecionados") {
                      appsAction("Encerrar apps") { opt.forceStop(it) }
                  }
                  addUi("Bloquear 2º plano de apps selecionados") {
                      appsAction("Bloquear segundo plano") { opt.restrictBg(it) }
                  }
                  addUi("Standby de apps (escolher nível)") {
                      val names = arrayOf("restricted (máxima economia)", "rare", "frequent", "working_set (padrão)", "active")
                      val vals = listOf("restricted", "rare", "frequent", "working_set", "active")
                      AlertDialog.Builder(this)
                          .setTitle("Nível de standby")
                          .setItems(names) { _, i -> appsAction("Apps: " + vals[i]) { opt.standby(it, vals[i]) } }
                          .show()
                  }
                  addUi("Modo jogo: desempenho para apps selecionados") {
                      appsAction("Modo jogo") { opt.gameMode(it, "performance") }
                  }

                  header("LIMPEZA XIAOMI (reversível)")
                  addUi("Remover bloatware e anúncios (escolher na lista)") {
                      exec.execute {
                          val list = opt.installedBloat()
                          runOnUiThread {
                              if (list.isEmpty()) toast("Nenhum bloatware conhecido encontrado.")
                              else multi(
                                  "Remover (RESTAURAR desfaz)",
                                  list.map { it.second + "\n" + it.first },
                                  list.map { it.first }
                              ) { sel -> if (sel.isNotEmpty()) runTask { opt.debloat(sel) } }
                          }
                      }
                  }

                  header("REDE")
                  add("DNS privado: Cloudflare") { opt.privateDns("one.one.one.one") }
                  add("DNS privado: Google") { opt.privateDns("dns.google") }
                  add("DNS privado: AdGuard (bloqueia anúncios)") { opt.privateDns("dns.adguard-dns.com") }
                  add("DNS privado: automático") { opt.privateDns(null) }

                  header("RESTAURAR")
                  add("♻️ RESTAURAR tudo ao original") { opt.restore() }

                  setContentView(ScrollView(this).apply { addView(root) })

                  Shizuku.addRequestPermissionResultListener(permListener)
                  Shizuku.addBinderReceivedListenerSticky(binderListener)
                  Shizuku.addBinderDeadListener(deadListener)
                  refresh()
              }

              private fun refresh() {
                  val ok = ready()
                  status.text = when {
                      !Shizuku.pingBinder() -> "● Shizuku não está rodando"
                      !ok -> "● Shizuku ativo, falta permissão"
                      else -> "● Pronto"
                  }
                  buttons.forEach { it.isEnabled = ok }
              }

              private fun runTask(action: () -> Unit) {
                  buttons.forEach { it.isEnabled = false }
                  exec.execute {
                      try {
                          action()
                          say("✔ Concluído")
                      } catch (e: Throwable) {
                          say("Erro: ${e.message}")
                      }
                      runOnUiThread { refresh() }
                  }
              }

              override fun onDestroy() {
                  Shizuku.removeRequestPermissionResultListener(permListener)
                  Shizuku.removeBinderReceivedListener(binderListener)
                  Shizuku.removeBinderDeadListener(deadListener)
                  super.onDestroy()
              }
          }
          FIM7
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PocoOptimizer-apk
          path: poco/app/build/outputs/apk/debug/app-debug.apk
